<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="seam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A85B"/>
      <stop offset="48%" stop-color="#C9B07A"/>
      <stop offset="100%" stop-color="#46C8DD"/>
    </linearGradient>
    <radialGradient id="glow-warm" cx="30%" cy="50%">
      <stop offset="0%" stop-color="#F2A85B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F2A85B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cool" cx="70%" cy="50%">
      <stop offset="0%" stop-color="#46C8DD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#46C8DD" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" fill="#0B0F14"/>
  <ellipse cx="60" cy="120" rx="90" ry="80" fill="url(#glow-warm)"/>
  <ellipse cx="180" cy="120" rx="90" ry="80" fill="url(#glow-cool)"/>
  <!-- Eye shape — "vision" motif -->
  <ellipse cx="120" cy="120" rx="72" ry="36" fill="none" stroke="url(#seam)" stroke-width="2" opacity="0.7"/>
  <!-- Iris -->
  <circle cx="120" cy="120" r="22" fill="none" stroke="url(#seam)" stroke-width="1.5" opacity="0.9"/>
  <!-- Pupil -->
  <circle cx="120" cy="120" r="9" fill="url(#seam)" opacity="0.85"/>
  <!-- Scan lines -->
  <line x1="48" y1="120" x2="94" y2="120" stroke="#F2A85B" stroke-width="1" opacity="0.35"/>
  <line x1="146" y1="120" x2="192" y2="120" stroke="#46C8DD" stroke-width="1" opacity="0.35"/>
  <!-- Corner tick marks -->
  <path d="M40 90 L40 70 L60 70" fill="none" stroke="#F2A85B" stroke-width="1.5" opacity="0.5"/>
  <path d="M200 90 L200 70 L180 70" fill="none" stroke="#46C8DD" stroke-width="1.5" opacity="0.5"/>
  <path d="M40 150 L40 170 L60 170" fill="none" stroke="#F2A85B" stroke-width="1.5" opacity="0.5"/>
  <path d="M200 150 L200 170 L180 170" fill="none" stroke="#46C8DD" stroke-width="1.5" opacity="0.5"/>
</svg>
